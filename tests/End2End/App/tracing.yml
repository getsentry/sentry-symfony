sentry:
  tracing:
    enabled: true
  options:
    traces_sample_rate: 1

services:
  Sentry\SentryBundle\Tests\End2End\App\EventListener\FirewallStubListener:
    arguments: ['@Sentry\State\HubInterface']
    tags:
      # The priority of Symfony's firewall
      - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 8 }

  Sentry\SentryBundle\Tests\End2End\App\Controller\TracingController:
    arguments:
      $hub: '@Sentry\State\HubInterface'
      $connection: '@?doctrine.dbal.default_connection'
    tags:
      - { name: controller.service_arguments }

  Sentry\SentryBundle\Tests\End2End\App\Controller\SubRequestController:
    arguments:
      $hub: '@Sentry\State\HubInterface'
      $httpKernel: '@http_kernel'
    tags:
      - { name: controller.service_arguments }

  Sentry\SentryBundle\Tests\End2End\App\Controller\TracingCacheController:
    arguments:
      $cache: '@cache.app'
      $connection: '@?doctrine.dbal.default_connection'
    tags:
      - { name: controller.service_arguments }

  Sentry\SentryBundle\Tests\End2End\App\Controller\PsrTracingCacheController:
    autowire: true
    tags:
      - { name: controller.service_arguments }

  Sentry\SentryBundle\Tests\End2End\App\Controller\NamespacedCacheController:
    arguments:
      $cache: '@cache.app.taggable'
    tags:
      - { name: controller.service_arguments }
